<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  <meta name="description" content="404 Not Found — The requested URL was not found on this server.">
  <meta property="og:title" content="404 Not Found">
  <meta property="og:description" content="The requested URL was not found on this server.">
  <meta name="robots" content="noarchive">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }

    /* custom cursor dot — hidden until click 6 */
    #cursor {
      position: fixed;
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      translate: -50% -50%;
      mix-blend-mode: difference;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    canvas { display: block; }

    /* tiny click-counter hint that appears only briefly */
    #hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      translate: -50% 0;
      color: #333;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #hint.visible { opacity: 1; }

    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 10000;
    }

    /* fake 404 page — covers everything until click 10 */
    #fakepage {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 9000;
      transition: opacity 1.5s ease;
    }
    #fakepage-inner {
      font-family: 'Times New Roman', Times, serif;
      padding: 3em 2em;
      color: #000;
    }
    #fakepage-inner h1 {
      font-size: 1.8em;
      font-weight: normal;
      margin: 0 0 0.4em;
    }
    #fakepage-inner p  { margin: 0 0 1em; font-size: 1em; }
    #fakepage-inner hr { border: none; border-top: 1px solid #aaa; margin: 1em 0; }
    #fakepage-inner address { font-style: italic; font-size: 0.85em; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="cursor"></div>
  <div id="hint">· · ·</div>
  <div id="flash"></div>

  <div id="fakepage">
    <div id="fakepage-inner">
      <h1>Not Found</h1>
      <p>The requested URL was not found on this server.</p>
      <hr>
      <address>Apache/2.4.54 (Debian) Server at 203.0.113.42 Port 80</address>
    </div>
  </div>

  <audio id="bgAudio" loop>
    <source src="mp3/steeldummaster.mp3" type="audio/mpeg">
  </audio>

  <script>
  (function () {
    // ── canvas setup ──────────────────────────────────────────────────────────
    var canvas = document.getElementById('c');
    var ctx    = canvas.getContext('2d');
    var W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ── mouse / touch tracking ────────────────────────────────────────────────
    var mouse    = { x: -9999, y: -9999 };
    var cursorEl = document.getElementById('cursor');

    window.addEventListener('mousemove', function (e) {
      mouse.x = e.clientX; mouse.y = e.clientY;
      cursorEl.style.left = e.clientX + 'px';
      cursorEl.style.top  = e.clientY + 'px';
    });
    window.addEventListener('mouseleave', function () { mouse.x = mouse.y = -9999; });

    // ── lerp-animated state ───────────────────────────────────────────────────
    // Every visual property has a current value and a target.
    // The draw loop steps each current toward its target every frame (smooth).
    var LR = 0.035;

    var eqAlpha = 0.0,  tEqAlpha = 0.0;    // equation brightness multiplier (starts invisible)
    var eqR = 211, eqG = 211, eqB = 211;   // equation text colour
    var tEqR = 211, tEqG = 211, tEqB = 211;
    var eqFontSz = 11.0, tEqFontSz = 11.0; // equation font size (px)
    var eqSpeedSc = 1.0, tEqSpeedSc = 1.0; // equation drift speed scale
    var lnR = 68,  lnG = 68,  lnB = 68;   // link colour
    var tLnR = 68, tLnG = 68, tLnB = 68;
    var lnAlpha = 0.18, tLnAlpha = 0.18;   // link max opacity
    var lnWidth = 0.6,  tLnWidth = 0.6;    // link stroke width
    var linkDist = 120, tLinkDist = 120;   // link draw distance
    var repelRad = 100, tRepelRad = 100;   // mouse repulsion radius
    var repelStr = 0.55, tRepelStr = 0.55; // mouse repulsion force
    var partSpd  = 3.5,  tPartSpd  = 3.5;  // particle max speed
    var bgAlpha  = 1.0,  tBgAlpha  = 1.0;  // trail fill alpha (1 = clearRect)
    var bgR = 0, bgG = 0, bgB = 0;         // trail fill colour
    var tBgR = 0, tBgG = 0, tBgB = 0;

    // ── physics particles ─────────────────────────────────────────────────────
    var particles = [];

    function Particle() {
      var v   = Math.floor(40 + Math.random() * 120);
      this.x  = Math.random() * W; this.y = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 1.2;
      this.vy = (Math.random() - 0.5) * 1.2;
      this.r  = 1.5 + Math.random() * 2;
      this.cr = v; this.cg = v; this.cb = v;
      this.tr = v; this.tg = v; this.tb = v;
      this.pa = 0;  // starts invisible, fades in
    }

    for (var i = 0; i < 120; i++) particles.push(new Particle());

    // ── floating equations ────────────────────────────────────────────────────
    var floaters = [
      'ψ(k) = ∫ ρ(r) e^{-i2πk·r} dr',
      'x_{t+1} = F x_t',
      'Ĉ₀ = X X^H',
      'G = I₁',
      '‖Hx - y‖₂² + λ‖Φ(x)‖₁',
      'x̂_H = U_b Â_H',
      'SNR ∝ B₀^{7/4}',
      'k_ep = K^{trans} / v_e',
    ].map(function (eq) {
      return { text: eq, x: Math.random()*W, y: Math.random()*H,
               vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25,
               base: 0, baseTarget: 0.04 + Math.random()*0.08 };
    });

    // ── render loop (not started until click 6) ───────────────────────────────
    var animating = false;

    function draw() {
      // step every lerp-animated value one frame closer to its target
      eqAlpha   += (tEqAlpha  - eqAlpha)  * LR;
      eqR       += (tEqR-eqR)*LR; eqG += (tEqG-eqG)*LR; eqB += (tEqB-eqB)*LR;
      eqFontSz  += (tEqFontSz - eqFontSz) * 0.003;
      eqSpeedSc += (tEqSpeedSc- eqSpeedSc)* LR;
      lnR       += (tLnR-lnR)*LR; lnG += (tLnG-lnG)*LR; lnB += (tLnB-lnB)*LR;
      lnAlpha   += (tLnAlpha  - lnAlpha)  * LR;
      lnWidth   += (tLnWidth  - lnWidth)  * LR;
      linkDist  += (tLinkDist - linkDist) * LR;
      repelRad  += (tRepelRad - repelRad) * LR;
      repelStr  += (tRepelStr - repelStr) * LR;
      partSpd   += (tPartSpd  - partSpd)  * LR;
      bgAlpha   += (tBgAlpha  - bgAlpha)  * LR;
      bgR       += (tBgR-bgR)*LR; bgG += (tBgG-bgG)*LR; bgB += (tBgB-bgB)*LR;

      if (bgAlpha > 0.998) {
        ctx.clearRect(0, 0, W, H);
      } else {
        ctx.fillStyle = 'rgba('+Math.round(bgR)+','+Math.round(bgG)+','+Math.round(bgB)+','+bgAlpha+')';
        ctx.fillRect(0, 0, W, H);
      }

      // floating equations — each floater fades in individually via its own base lerp
      var eqCol = 'rgb('+Math.round(eqR)+','+Math.round(eqG)+','+Math.round(eqB)+')';
      ctx.font = Math.round(eqFontSz) + 'px monospace';
      floaters.forEach(function (f) {
        f.base += (f.baseTarget - f.base) * 0.018;  // individual fade-in
        f.x += f.vx * eqSpeedSc; f.y += f.vy * eqSpeedSc;
        if (f.x < 0 || f.x > W) f.vx *= -1;
        if (f.y < 0 || f.y > H) f.vy *= -1;
        ctx.globalAlpha = Math.min(1, f.base * eqAlpha);
        ctx.fillStyle   = eqCol;
        ctx.fillText(f.text, f.x, f.y);
      });
      ctx.globalAlpha = 1;

      // particles — physics update + individual alpha fade-in
      var lnCol = 'rgb('+Math.round(lnR)+','+Math.round(lnG)+','+Math.round(lnB)+')';
      particles.forEach(function (p) {
        p.pa += (1.0 - p.pa) * 0.018;  // fade in from invisible
        p.cr += (p.tr-p.cr)*LR; p.cg += (p.tg-p.cg)*LR; p.cb += (p.tb-p.cb)*LR;

        var dx = p.x-mouse.x, dy = p.y-mouse.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < repelRad && dist > 0) {
          var force = (1-dist/repelRad)*repelStr;
          p.vx += (dx/dist)*force; p.vy += (dy/dist)*force;
        }

        var spd = Math.sqrt(p.vx*p.vx+p.vy*p.vy);
        if (spd > partSpd) { p.vx = p.vx/spd*partSpd; p.vy = p.vy/spd*partSpd; }

        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) { p.x = 0; p.vx =  Math.abs(p.vx)*0.9; }
        if (p.x > W) { p.x = W; p.vx = -Math.abs(p.vx)*0.9; }
        if (p.y < 0) { p.y = 0; p.vy =  Math.abs(p.vy)*0.9; }
        if (p.y > H) { p.y = H; p.vy = -Math.abs(p.vy)*0.9; }
      });

      // connections — alpha scaled by average particle visibility so they fade in with their dots
      for (var a = 0; a < particles.length; a++) {
        for (var b = a+1; b < particles.length; b++) {
          var ptA = particles[a], ptB = particles[b];
          var ddx = ptA.x-ptB.x, ddy = ptA.y-ptB.y;
          var d = Math.sqrt(ddx*ddx+ddy*ddy);
          if (d < linkDist) {
            ctx.globalAlpha = (1-d/linkDist) * lnAlpha * (ptA.pa+ptB.pa) * 0.5;
            ctx.strokeStyle = lnCol;
            ctx.lineWidth   = lnWidth;
            ctx.beginPath(); ctx.moveTo(ptA.x,ptA.y); ctx.lineTo(ptB.x,ptB.y); ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;

      // particles rendered with their individual fade-in alpha
      particles.forEach(function (p) {
        ctx.globalAlpha = p.pa;
        ctx.fillStyle = 'rgb('+Math.round(p.cr)+','+Math.round(p.cg)+','+Math.round(p.cb)+')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;

      requestAnimationFrame(draw);
    }
    // draw() NOT called here — page stays black until click 6

    // ── audio ─────────────────────────────────────────────────────────────────
    var audio = document.getElementById('bgAudio');
    function startAudio() { audio.volume = 0.35; audio.play().catch(function(){}); }

    // ── escape / progression ──────────────────────────────────────────────────
    var clickCount    = 0;
    var hint          = document.getElementById('hint');
    var hintTimer     = null;
    var lastTouchTime = 0;

    function escape() {
      var flash = document.getElementById('flash');
      flash.style.transition = 'opacity 1.4s ease-in-out';
      flash.style.opacity    = '1';
      setTimeout(function () { window.location.href = 'secrethome.html'; }, 1600);
    }

    function showHint() {
      clearTimeout(hintTimer);
      hint.classList.add('visible');
      hintTimer = setTimeout(function () { hint.classList.remove('visible'); }, 1800);
    }

    // clicks  1–9 : white 404 page, normal cursor, total silence
    // click  10   : 404 fades to black; audio + animation wake underneath
    //               cursor switches to dot after fade completes (~1.5s)
    // clicks 11–29: one effect each, lerp-smoothed
    // click  30   : slow white fade → secrethome
    function applyClickEffect(n) {
      var ii;
      switch (n) {
        case 10:
          // restore real title, start audio + animation, fade 404 page out
          document.title = 'Stony';
          startAudio();
          if (!animating) { animating = true; draw(); }
          tEqAlpha = 3.0;
          var fp = document.getElementById('fakepage');
          fp.style.opacity = '0';
          setTimeout(function () {
            fp.style.display = 'none';
            document.body.style.cursor = 'none';
            cursorEl.style.opacity = '1';
          }, 1600);
          break;
        case 11:
          tLnAlpha = 0.38;
          break;
        case 12:
          tLnR = 25; tLnG = 65; tLnB = 85;
          break;
        case 13:
          particles.forEach(function (p, idx) {
            var b = Math.floor(50 + Math.random()*90);
            if (idx % 2 === 0) { p.tr = Math.min(255,b+70); p.tg = b; p.tb = Math.max(0,b-50); }
            else                { p.tr = Math.max(0,b-50);  p.tg = b; p.tb = Math.min(255,b+70); }
          });
          break;
        case 14:
          tPartSpd = 5.5;
          break;
        case 15:
          for (ii = 0; ii < 25; ii++) particles.push(new Particle());
          break;
        case 16:
          tRepelRad = 200; tRepelStr = 1.1;
          break;
        case 17:
          tBgAlpha = 0.90;
          break;
        case 18:
          tEqR = 200; tEqG = 168; tEqB = 106;
          break;
        case 19:
          ['∇²B = μ₀σ ∂B/∂t','T₁: Mz = M₀(1−e^{−t/T₁})','ω₀ = γB₀','T₂: Mxy = M₀e^{−t/T₂}']
            .forEach(function (eq) {
              floaters.push({ text: eq, x: Math.random()*W, y: Math.random()*H,
                vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
                base: 0, baseTarget: 0.025 + Math.random()*0.025 });
            });
          break;
        case 20:
          tLnWidth = 1.6;
          break;
        case 21:
          tBgAlpha = 0.81;
          break;
        case 22:
          tBgR = 4; tBgG = 4; tBgB = 20;
          break;
        case 23:
          tEqR = 155; tEqG = 170; tEqB = 220;
          break;
        case 24:
          tEqSpeedSc = 2.5;
          break;
        case 25:
          particles.forEach(function (p) {
            var v = Math.floor(80 + Math.random()*120);
            p.tr = Math.min(255, v + Math.floor(Math.random()*80));
            p.tg = Math.min(255, v - Math.floor(Math.random()*40));
            p.tb = Math.min(255, v + Math.floor(Math.random()*100));
          });
          break;
        case 26:
          tLinkDist = 240;
          break;
        case 27:
          for (ii = 0; ii < 25; ii++) particles.push(new Particle());
          tPartSpd = 9.0;
          break;
        case 28:
          tEqAlpha = 9.0;
          tBgAlpha = 0.72;
          ['B₁⁺ = |γ| τ G','Δω = γ ΔB₀','χ = M/H','FA = γ B₁ τ']
            .forEach(function (eq) {
              floaters.push({ text: eq, x: Math.random()*W, y: Math.random()*H,
                vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
                base: 0, baseTarget: 0.02 + Math.random()*0.02 });
            });
          break;
        case 29:
          // equations bleach to white — everything burns bright before the portal
          tEqR = 255; tEqG = 255; tEqB = 255;
          break;
      }
    }

    function countTap() {
      clickCount++;
      if (clickCount >= 11 && clickCount < 30) showHint();
      if (clickCount <= 29) applyClickEffect(clickCount);
      if (clickCount >= 30) escape();
    }

    window.addEventListener('touchend', function () {
      lastTouchTime = Date.now(); countTap();
    });
    window.addEventListener('click', function () {
      if (Date.now() - lastTouchTime < 500) return;
      countTap();
    });

    var typedBuffer = '';
    window.addEventListener('keydown', function (e) {
      if (e.key.length === 1) {
        e.preventDefault();
        typedBuffer += e.key.toLowerCase();
        if (typedBuffer.length > 7) typedBuffer = typedBuffer.slice(-7);
        if (typedBuffer.slice(-5) === 'meggy' || typedBuffer.slice(-7) === 'letmein') escape();
      } else {
        typedBuffer = '';
      }
    });
  })();
  </script>
</body>
</html>
